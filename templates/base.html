{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GiftList{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    class="brand-logo"
                    alt="Логотип GiftList"
                    width="64"
                    height="64"
                >
                <span>GiftList</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="container site-footer">
        <span>© <span id="current-year"></span> GiftList</span>
        <span>Сервис формирования списка подарков</span>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
