<a class="list-group-item list-group-item-action event-row"
   href="{% url 'occasions:detail' occasion.id %}">
    <span><strong>{{ occasion.name|default:"Без названия" }}</strong>
        <small>{{ occasion.recipient_name }}</small></span>
    <time datetime="{{ occasion.event_date }}">{{ occasion.event_date }}</time>
</a>
